<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Options menu — dev harness</title>

    <!--
      The design's own fonts: Barlow Condensed for the headings,
      Inter for the UI. The mockup's instruction is to keep the layout
      and swap the fonts if they cannot be loaded, so nothing here
      depends on them arriving.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #0b0907;
        color: #f2e9d8;
        font-family: Inter, system-ui, -apple-system, sans-serif;
      }
    </style>
  </head>
  <body>
    <!--
      THE DEV HARNESS.

      It mounts the real options overlay — the same component the game
      mounts — with a mocked engine and a mocked readout, so the
      redesign can be iterated on in a browser without a game session.

      The page is DEV ONLY: it is not in the production build's
      inputs, so it never ships.
    -->
    <div id="dev-options"></div>
    <script type="module" src="/src/dev-options.ts"></script>
  </body>
</html>
