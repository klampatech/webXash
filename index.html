    <!-- The Specialists landing theme.
         Barlow Condensed stands in for the condensed GoldSrc HUD lettering;

         neither of which we can ship — see src/assets/ts-theme.css. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Share+Tech+Mono&display=swap"
      rel="stylesheet"
    />
