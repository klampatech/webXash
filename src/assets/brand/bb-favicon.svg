<!--
  BulletBallet — the favicon.

  "BB", in the wordmark's two-tone: the first B in the ghost-white the
  wordmark's BULLET is drawn in, the second in the phosphor green
  BALLET is drawn in. On the void ground, so it holds its contrast in a
  dark tab and in a light one.

  WHY LETTERS AND NOT THE MARK
  =============================
  The mark is two slender cartridges with internal cutouts. At 16px the
  cutouts vanish and what is left is a pair of green blobs — which is
  what this file used to be, and what it read as. The letterforms are
  drawn as paths rather than set in a font, so the favicon is the same
  drawing on every machine: a system font would render a different B
  on Windows than on a phone.

  The counters are cut large. At 16px a B is eight pixels wide, and a
  counter of one pixel is not a counter — it is a smudge, and the B
  reads as a solid bar. These are as big as the letterform will carry.
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 32 32"
  role="img"
  aria-label="BulletBallet"
>
  <rect width="32" height="32" fill="#010a04" />
  <g fill-rule="evenodd">
    <path
      fill="#d8ffe2"
      d="M2.6 3.4h6.6c3.6 0 5.9 2.1 5.9 5.4 0 2.3-1.2 4-3.2 4.8 2.6.8 4.1 2.8 4.1 5.8 0 5-2.8 7.8-7.6 7.8H2.6Zm4.4 3.9v4.4h1.9c1.7 0 2.6-.8 2.6-2.2s-.9-2.2-2.6-2.2H7Zm0 8.3v7.2h2.3c2 0 3.1-1.2 3.1-3.6s-1.1-3.6-3.1-3.6H7Z"
    />
    <path
      fill="#00ff41"
      d="M17 3.4h6.6c3.6 0 5.9 2.1 5.9 5.4 0 2.3-1.2 4-3.2 4.8 2.6.8 4.1 2.8 4.1 5.8 0 5-2.8 7.8-7.6 7.8H17Zm4.4 3.9v4.4h1.9c1.7 0 2.6-.8 2.6-2.2s-.9-2.2-2.6-2.2h-1.9Zm0 8.3v7.2h2.3c2 0 3.1-1.2 3.1-3.6s-1.1-3.6-3.1-3.6h-2.3Z"
    />
  </g>
</svg>
